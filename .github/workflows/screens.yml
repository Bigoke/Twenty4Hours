name: Screenshots

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render every screen
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest --tests '*ScreenshotTest*' 2>&1 | tee test.log

      - name: Debug outputs
        if: always()
        run: |
          echo "::notice::pngs: $(find . -name '*.png' -newer gradlew -not -path './.git/*' | grep -v '/res/' | head -5 | tr '\n' ' ')"
          echo "::notice::results: $(ls app/build/test-results/testDebugUnitTest/ 2>&1 | head -3 | tr '\n' ' ')"
          for f in app/build/test-results/testDebugUnitTest/*.xml; do echo "::notice::$(grep -o '<testsuite [^>]*>' $f | head -1)"; grep -o 'roborazzi[^<]*' $f | head -3 | while read l; do echo "::notice::$l"; done; done
          grep -i "roborazzi\|skipped" test.log | head -5 | while read l; do echo "::notice::$l"; done

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Exception" -A3 test.log | head -60 > errors.txt || true
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            grep -A4 "<failure" "$f" | head -12 >> errors.txt || true
          done
          while IFS= read -r line; do echo "::error::$line"; done < <(head -45 errors.txt)

      - name: Publish screenshots to the screens branch
        if: always()
        run: |
          ls app/build/screens/*.png >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/out && cp app/build/screens/*.png /tmp/out/
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan screens-out
          git rm -rfq --cached .
          rm -rf ./*
          cp /tmp/out/*.png .
          git add -f *.png
          git commit -qm "screens for ${{ github.sha }}"
          git push -qf origin HEAD:refs/heads/screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: app/build/screens/*.png
          if-no-files-found: warn
