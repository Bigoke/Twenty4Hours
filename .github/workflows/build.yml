name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up signing key (from repo secrets, if present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "T24_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "T24_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "T24_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "T24_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set; APK is signed with a temporary debug key."
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk Twenty4Hours-v1.0.${{ github.run_number }}.apk

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 > errors.txt || true
          while IFS= read -r line; do echo "::error::$line"; done < <(head -45 errors.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Twenty4Hours-apk
          path: Twenty4Hours-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Twenty4Hours v1.0.${{ github.run_number }}
          body: |
            Install on your phone: download the APK below and open it.
            Built from ${{ github.sha }}.
          files: Twenty4Hours-*.apk
          make_latest: true
